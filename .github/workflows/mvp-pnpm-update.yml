name: MVP pnpm One-Shot Update

on:
  push:
    branches:
      - implementation/mvp-edgeone-exact-baseline
    paths:
      - .github/workflows/mvp-pnpm-update.yml

permissions:
  contents: write

jobs:
  update-pnpm:
    if: github.repository == 'thanhhaixn92/Pqg-desktop' && github.ref == 'refs/heads/implementation/mvp-edgeone-exact-baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: implementation/mvp-edgeone-exact-baseline
          persist-credentials: true
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2

      - run: corepack enable

      - name: Pin stable and beta to pnpm 11.25.0
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs')
          const files = [
            'dsh-plugin-desktop/package.json',
            'dsh-plugin-desktop-beta/package.json',
          ]
          for (const filename of files) {
            const manifest = JSON.parse(readFileSync(filename, 'utf8'))
            if (manifest.dependencies?.pnpm !== '11.8.0') {
              throw new Error(`${filename}: expected audited pnpm 11.8.0, got ${manifest.dependencies?.pnpm}`)
            }
            manifest.dependencies.pnpm = '11.25.0'
            writeFileSync(filename, `${JSON.stringify(manifest, null, 2)}\n`)
          }
          NODE

      - name: Regenerate Yarn lockfile
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
        run: yarn install

      - name: Verify patched pnpm invariant
        run: node --test scripts/mvp-pnpm-security.test.mjs

      - name: Verify Profile materializer secret isolation
        run: yarn workspace dsh-plugin-desktop test tests/profile-materializer.spec.ts

      - name: Restrict generated diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            dsh-plugin-desktop-beta/package.json
            dsh-plugin-desktop/package.json
            yarn.lock
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected generated diff:\n'
            printf '  %s\n' "${changed[@]}"
            exit 1
          fi

      - name: Commit deterministic dependency update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dsh-plugin-desktop/package.json dsh-plugin-desktop-beta/package.json yarn.lock
          git commit -m 'fix(security): update packaged pnpm to 11.25.0'
          git push origin HEAD:implementation/mvp-edgeone-exact-baseline
